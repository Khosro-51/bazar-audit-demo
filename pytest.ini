[pytest]
# Wave 0I (audit B4): the long Monte Carlo pre-release gate is marked `release`
# and DESELECTED by default so ordinary `pytest` stays fast. Run it explicitly with
#   pytest -m release
# (the CLI `-m` overrides the default below).
addopts = -m "not release"
markers =
    release: long-running pre-release validation (large-N Monte Carlo); deselected by default
